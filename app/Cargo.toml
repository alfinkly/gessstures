[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
graph_core = { path = "../graph-core" }
ai_pipeline = { path = "../ai-pipeline" }
data_sources = { path = "../data-sources" }
input_sources = { path = "../input-sources" }
hand-tracking-core = { path = "../hand-tracking-core", features = ["bevy"] }
bevy = "0.15"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
petgraph = "0.7"
rand = "0.8"
pulldown-cmark = "0.12"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
