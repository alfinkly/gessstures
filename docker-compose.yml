services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gessstures
      POSTGRES_USER: gessstures
      POSTGRES_PASSWORD: gessstures
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ws-bridge/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gessstures"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ws-bridge:
    build:
      context: .
      dockerfile: ws-bridge/Dockerfile
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgres://gessstures:gessstures@postgres:5432/gessstures
      RUST_BACKTRACE: 1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  superset:
    image: apache/superset:latest
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: gessstures-superset-secret-key
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes:
      - superset_data:/app/superset_home
      - ./scripts/superset-init.sh:/app/superset-init.sh
    depends_on:
      - redis
    entrypoint: []
    command:
      - sh
      - -c
      - |
        chmod +x /app/superset-init.sh &&
        /app/superset-init.sh &&
        superset run -p 8088 --with-threads --reload --debugger

volumes:
  pgdata:
  redis_data:
  superset_data:
