services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gessstures
      POSTGRES_USER: gessstures
      POSTGRES_PASSWORD: gessstures
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ws-bridge/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gessstures"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ws-bridge:
    build:
      context: .
      dockerfile: ws-bridge/Dockerfile
    ports:
      - "3030:3030"
    environment:
      RUST_BACKTRACE: 1
    volumes:
      - ./models:/app/models

  superset:
    image: apache/superset:latest
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: gessstures-superset-key
    command: >
      sh -c "
        superset db upgrade &&
        superset fab create-admin --username admin --password admin --firstname Admin --lastname User --email admin@example.com 2>/dev/null || true &&
        superset init 2>/dev/null || true &&
        superset run -p 8088 --with-threads
      "

volumes:
  pgdata:
