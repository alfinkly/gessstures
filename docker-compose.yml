services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gessstures
      POSTGRES_USER: gessstures
      POSTGRES_PASSWORD: gessstures
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ws-bridge/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gessstures"]
      interval: 3s
      timeout: 3s
      retries: 5

  ws-bridge:
    build:
      context: .
      dockerfile: ws-bridge/Dockerfile
    ports:
      - "3030:3030"
    environment:
      DATABASE_URL: postgres://gessstures:gessstures@postgres:5432/gessstures
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models

volumes:
  pgdata:
