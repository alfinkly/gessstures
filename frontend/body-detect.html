<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gessstures — Body Detect Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #container {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px; gap: 16px; height: 100vh;
    }
    #main-wrapper {
      position: relative; width: 100%; max-width: 960px;
      border-radius: 12px; overflow: hidden; background: #111;
      flex-shrink: 0;
    }
    #main-wrapper video { display: block; width: 100%; border-radius: 12px; }
    #main-wrapper canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #count-badge {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      padding: 6px 16px; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      pointer-events: none;
    }
    #count-badge .num { color: #4ade80; }
    #ws-indicator {
      position: absolute; top: 12px; right: 12px;
      padding: 6px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 500;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    }
    #ws-indicator.on { color: #4ade80; }
    #ws-indicator.off { color: #f87171; }
    #tiles-row {
      display: flex; gap: 12px; flex-wrap: wrap;
      width: 100%; max-width: 960px;
      min-height: 80px;
    }
    #tiles-row .tile-wrapper {
      position: relative; flex: 0 0 auto;
      border-radius: 10px; overflow: hidden; background: #111;
    }
    #tiles-row .tile-wrapper canvas {
      display: block; width: 100%; height: 100%; object-fit: cover;
    }
    #tiles-row .tile-wrapper .tile-num {
      position: absolute; top: 6px; left: 8px;
      background: rgba(0,0,0,0.6); font-size: 12px;
      padding: 2px 8px; border-radius: 4px;
    }
    #loading {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0f; font-size: 18px;
    }
    #loading .spinner {
      width: 28px; height: 28px; border: 3px solid #334155;
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Opening camera…</span>
  </div>

  <div id="container" class="hidden">
    <div id="main-wrapper">
      <video id="video" autoplay playsinline></video>
      <canvas id="overlay-canvas"></canvas>
      <div id="count-badge">Persons: <span class="num" id="person-count">0</span></div>
      <div id="ws-indicator" class="off">● offline</div>
    </div>
    <div id="tiles-row"></div>
  </div>

  <script src="body-detect.js"></script>
</body>
</html>
